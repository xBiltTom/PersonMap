[project]
name = "person-map-backend"
version = "0.1.0"
description = "OSINT Person Map and Footprint Awareness Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "litellm>=1.99.0",
    "phonenumbers>=9.0.38",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "thefuzz>=0.22.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Mock del transporte de httpx: permite probar el parseo de cada tool OSINT
    # contra respuestas grabadas, en vez de depender de que el sitio real siga
    # vivo y accesible desde la máquina que corre los tests.
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
# Por defecto se excluyen los tests que tocan la red o PostgreSQL, de modo que
# `uv run pytest` sea rápido, determinista y funcione sin conexión. La suite
# completa se lanza explícitamente:
#   uv run pytest -m "network or db"    (o `-m ""` para absolutamente todo)
addopts = "-m 'not network and not db'"
markers = [
    "network: requiere acceso real a Internet (fuentes OSINT externas)",
    "db: requiere una base de datos PostgreSQL operativa",
]
